name: Automated Data Preprocessing Workflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: 

jobs:
  preprocess:
    runs-on: ubuntu-latest

    steps:
    # 1. Mengambil semua kode dari repository
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. Mensetup environment Python 3.12
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    # 3. Meng-install library yang dibutuhkan
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy

    # 4. Menjalankan script otomatisasi preprocessing
    - name: Run Preprocessing Script
      run: |
        python preprocessing/automate_Nabila.py 

    # 5. Menyimpan dataset hasil preprocessing sebagai artefak
    - name: Upload Cleaned Dataset Artifact
      uses: actions/upload-artifact@v4
      with:
        name: amazon-delivery-dataset
        path: amazon_delivery.csv
